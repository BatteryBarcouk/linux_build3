name: Build YS-M1 RK3128 Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf make bc libssl-dev bison flex device-tree-compiler git
        arm-linux-gnueabihf-gcc --version

    - name: Clone kernel
      run: |
        git clone --depth=1 -b release-3.10 https://github.com/rockchip-linux/kernel.git rk3128-kernel

    - name: Apply patches
      working-directory: rk3128-kernel
      run: |
        sed -i 's|CC\t\t= $(srctree)/scripts/gcc-wrapper.py $(CROSS_COMPILE)gcc|CC\t\t= $(CROSS_COMPILE)gcc|' Makefile
        sed -i 's/YYLTYPE yylloc/extern YYLTYPE yylloc/' scripts/dtc/dtc-lexer.lex.c_shipped
        find arch/arm -name "*.S" | xargs sed -i 's/, #alloc, #execinstr/,"ax"/g; s/#alloc,#execinstr/"ax"/g; s/, #alloc/,"a"/g' 2>/dev/null || true
        sed -i 's/arch-$(CONFIG_CPU_32v7).*$/arch-$(CONFIG_CPU_32v7)\t\t:=-D__LINUX_ARM_ARCH__=7 -march=armv7-a/' arch/arm/Makefile
        sed -i 's|#define __asmeq(x, y).*$|#define __asmeq(x, y) ""|' arch/arm/include/asm/compiler.h
        find security/optee_linuxdriver -name "Makefile" -exec sed -i 's/ccflags-y+=-Werror/ccflags-y+=-Wno-error/g' {} \;
        sed -i '/KBUILD_CFLAGS.*FRAME_WARN/a KBUILD_CFLAGS\t+= -Wno-attributes -Wno-error=attributes' Makefile
        sed -i '/#include <linux\/usb\/cdc.h>/a #include <linux\/types.h>' drivers/usb/gadget/f_rndis.c
        echo "Patches done"

    - name: Create DTS files
      working-directory: rk3128-kernel
      run: |
        echo "" | base64 -d > arch/arm/boot/dts/lcd-ys-m1-ili9881c-mipi.dtsi
        echo "" | base64 -d > arch/arm/boot/dts/rk3128-ys-m1.dts
        sed -i '/rk3128-fireprime.dtb/a \\trk3128-ys-m1.dtb \\' arch/arm/boot/dts/Makefile
        echo "DTS files created"

    - name: Configure kernel
      working-directory: rk3128-kernel
      run: |
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- rockchip_defconfig
        scripts/config --disable CONFIG_MEDIA_SUPPORT
        scripts/config --disable CONFIG_DVB_CORE
        scripts/config --disable CONFIG_VIDEO_DEV
        scripts/config --disable CONFIG_BT
        scripts/config --disable CONFIG_SOUND
        scripts/config --disable CONFIG_SND
        scripts/config --disable CONFIG_NETFILTER
        scripts/config --disable CONFIG_NF_CONNTRACK
        scripts/config --disable CONFIG_RTL8188EU
        scripts/config --disable CONFIG_ROCKCHIP_WLAN
        scripts/config --disable CONFIG_USB_GADGET
        scripts/config --disable CONFIG_ARM_PATCH_PHYS_VIRT
        scripts/config --disable CONFIG_ROCKCHIP_PIE
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig

    - name: Build kernel
      working-directory: rk3128-kernel
      run: |
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -j$(nproc) zImage rk3128-ys-m1.dtb 2>&1 | tee build.log || true
        echo "=== ERRORS ==="
        grep ": error:" build.log | head -30
        ls arch/arm/boot/zImage && echo "BUILD SUCCESS" || exit 1

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ys-m1-kernel
        path: |
          rk3128-kernel/arch/arm/boot/zImage
          rk3128-kernel/arch/arm/boot/dts/rk3128-ys-m1.dtb
        retention-days: 30
