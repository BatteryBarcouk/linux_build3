name: Build YS-M1 RK3128 Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf make bc libssl-dev \
          bison flex device-tree-compiler git
        arm-linux-gnueabihf-gcc --version

    - name: Clone kernel
      run: |
        git clone --depth=1 -b release-3.10 \
          https://github.com/rockchip-linux/kernel.git rk3128-kernel

    - name: Apply patches
      working-directory: rk3128-kernel
      run: |
        # Disable gcc-wrapper
        sed -i 's|CC\t\t= \$(srctree)/scripts/gcc-wrapper.py \$(CROSS_COMPILE)gcc|CC\t\t= $(CROSS_COMPILE)gcc|' Makefile

        # Fix dtc build
        sed -i 's/YYLTYPE yylloc/extern YYLTYPE yylloc/' scripts/dtc/dtc-lexer.lex.c_shipped

        # Fix ARM assembly section flags
        find arch/arm -name "*.S" | xargs sed -i \
          's/, #alloc, #execinstr/,"ax"/g; s/#alloc,#execinstr/"ax"/g; s/, #alloc/,"a"/g' 2>/dev/null || true

        # Force armv7-a
        sed -i 's/arch-\$(CONFIG_CPU_32v7)\t\t:=-D__LINUX_ARM_ARCH__=7 \$(call cc-option,-march=armv7-a,-march=armv5t -Wa\$(comma)-march=armv7-a)/arch-$(CONFIG_CPU_32v7)\t\t:=-D__LINUX_ARM_ARCH__=7 -march=armv7-a/' arch/arm/Makefile

        # Disable __asmeq
        sed -i 's|#define __asmeq(x, y).*$|#define __asmeq(x, y) ""|' arch/arm/include/asm/compiler.h

        # Fix Werror in optee
        find security/optee_linuxdriver -name "Makefile" -exec \
          sed -i 's/ccflags-y+=-Werror/ccflags-y+=-Wno-error/g' {} \;

        # Suppress log2.h warning
        sed -i '/KBUILD_CFLAGS.*FRAME_WARN/a KBUILD_CFLAGS\t+= -Wno-attributes -Wno-error=attributes' Makefile

        # Fix f_rndis.c
        sed -i '/#include <linux\/usb\/cdc.h>/a #include <linux\/types.h>' drivers/usb/gadget/f_rndis.c

        echo "Patches done"

    - name: Create YS-M1 DTS files
      working-directory: rk3128-kernel
      run: |
        cat > arch/arm/boot/dts/lcd-ys-m1-ili9881c-mipi.dtsi << 'DTSI'
#include <dt-bindings/rkmipi/mipi_dsi.h>
/ {
  disp_mipi_init: mipi_dsi_init {
    compatible = "rockchip,mipi_dsi_init";
    rockchip,screen_init = <1>;
    rockchip,dsi_lane = <4>;
    rockchip,dsi_hs_clk = <500>;
    rockchip,mipi_dsi_num = <1>;
  };
  disp_mipi_power_ctr: mipi_power_ctr {
    compatible = "rockchip,mipi_power_ctr";
  };
  disp_mipi_init_cmds: screen-on-cmds {
    compatible = "rockchip,screen-on-cmds";
    rockchip,cmd_debug = <1>;
    rockchip,on-cmds1   { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0xe0 0x00>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds2   { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0xe1 0x93>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds3   { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0xe2 0x65>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds4   { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0xe3 0xf8>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds5   { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0x80 0x03>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds6   { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0xe0 0x01>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds7   { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0x00 0x00>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds8   { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0x01 0xa0>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds9   { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0x17 0x00>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds10  { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0x18 0xb1>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds11  { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0x19 0x01>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds12  { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0x1a 0x00>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds13  { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0x1b 0xb1>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds14  { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0x1c 0x01>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds15  { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0x1f 0x3e>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds16  { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0x20 0x28>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds17  { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0x21 0x28>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds18  { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0x22 0x0e>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds19  { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0x26 0xf1>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds20  { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0x37 0x19>; rockchip,cmd_delay=<0>; };
    rockchip,on-cmds150 { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0x11 0x00>; rockchip,cmd_delay=<120>; };
    rockchip,on-cmds151 { compatible="rockchip,on-cmds"; rockchip,cmd_type=<LPDT>; rockchip,dsi_id=<0>; rockchip,cmd=<0x15 0x29 0x00>; rockchip,cmd_delay=<20>; };
  };
  disp_timings: display-timings {
    compatible = "rockchip,display-timings";
    native-mode = <&timing0>;
    timing0: timing0 {
      screen-type = <SCREEN_MIPI>;
      lvds-format = <LVDS_8BIT_1>;
      out-face = <OUT_P888>;
      clock-frequency = <68000000>;
      hactive = <800>; vactive = <1280>;
      hback-porch = <48>; hfront-porch = <16>; hsync-len = <16>;
      vback-porch = <16>; vfront-porch = <8>; vsync-len = <8>;
      hsync-active = <0>; vsync-active = <0>;
      de-active = <0>; pixelclk-active = <0>;
      swap-rb = <0>; swap-rg = <0>; swap-gb = <0>;
    };
  };
};
DTSI

        cat > arch/arm/boot/dts/rk3128-ys-m1.dts << 'DTS'
/dts-v1/;
#include "rk3128.dtsi"
#include "rk312x-sdk.dtsi"
#include "lcd-ys-m1-ili9881c-mipi.dtsi"
/ {
  model = "Yisheng YS-M1 RK3128";
  compatible = "rockchip,rk3128";
  memory { device_type = "memory"; reg = <0x60000000 0x40000000>; };
  backlight: backlight {
    compatible = "pwm-backlight";
    pwms = <&pwm0 0 25000 0>;
    brightness-levels = <0 64 128 192 255>;
    default-brightness-level = <4>;
  };
};
&pwm0 { status = "okay"; };
&rk_screen { display-timings = <&disp_timings>; };
&dsihost0 { status = "okay"; };
&lcdc { status = "okay"; backlight = <&backlight>; };
&fb { rockchip,disp-mode = <NO_DUAL>; rockchip,uboot-logo-on = <0>; };
DTS

        sed -i '/rk3128-fireprime.dtb/a \\trk3128-ys-m1.dtb \\' arch/arm/boot/dts/Makefile

    - name: Configure kernel
      working-directory: rk3128-kernel
      run: |
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- rockchip_defconfig
        # Disable everything non-essential
        scripts/config --disable CONFIG_MEDIA_SUPPORT
        scripts/config --disable CONFIG_DVB_CORE
        scripts/config --disable CONFIG_VIDEO_DEV
        scripts/config --disable CONFIG_BT
        scripts/config --disable CONFIG_SOUND
        scripts/config --disable CONFIG_SND
        scripts/config --disable CONFIG_NETFILTER
        scripts/config --disable CONFIG_NF_CONNTRACK
        scripts/config --disable CONFIG_RTL8188EU
        scripts/config --disable CONFIG_ROCKCHIP_WLAN
        scripts/config --disable CONFIG_USB_ETH
        scripts/config --disable CONFIG_USB_RNDIS
        scripts/config --disable CONFIG_USB_FUNCTIONFS
        scripts/config --disable CONFIG_USB_MASS_STORAGE
        scripts/config --disable CONFIG_USB_G_ANDROID
        scripts/config --disable CONFIG_USB_GADGET
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig

    - name: Build kernel
      working-directory: rk3128-kernel
      run: |
        make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -j$(nproc) zImage rk3128-ys-m1.dtb 2>&1 | tee build.log || true
        echo "=== ERRORS ==="
        grep ": error:" build.log | head -30
        ls arch/arm/boot/zImage && echo "BUILD SUCCESS" || exit 1

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ys-m1-kernel
        path: |
          rk3128-kernel/arch/arm/boot/zImage
          rk3128-kernel/arch/arm/boot/dts/rk3128-ys-m1.dtb
        retention-days: 30
